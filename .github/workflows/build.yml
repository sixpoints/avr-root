name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      # ---- 原生 payload：offsets 是编译期常量，必须按本仓库的 avr 头重新编译 ----
      - name: Resolve NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            "$SDKMANAGER" "ndk;27.2.12479018" || "$SDKMANAGER" "ndk;26.1.10909125"
            NDK=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          test -d "$NDK" || { echo "NDK not found"; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      - name: Build native payloads (libtimer-a16.so / libtimer-a17.so)
        run: |
          chmod +x exploit/build.sh
          CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
          TARGET=aarch64-linux-android31 \
          bash exploit/build.sh
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Build helper tools (taskleak / leak probes)
        run: |
          CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          mkdir -p tools-out
          for t in taskleak leak1 leak2; do
            "$CC" --target=aarch64-linux-android31 -O2 -std=gnu11 -static \
              -fno-stack-protector -fno-pic -ffunction-sections -fdata-sections \
              exploit/tools/$t.c -o tools-out/$t \
              -Wl,--gc-sections -Wl,-s || echo "skip $t"
          done
          ls -la tools-out/

      - name: Upload helper tools
        uses: actions/upload-artifact@v4
        with:
          name: AvrRoot-tools
          path: tools-out/*
          if-no-files-found: warn

      # 缓存 Gradle 依赖：Maven Central 偶尔会对 CI 出口 IP 返回 429
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.internal.http.connectionTimeout=60000 \
            -Dorg.gradle.internal.http.socketTimeout=60000

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvrRoot-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat version.txt)"
          cp app/build/outputs/apk/release/app-release.apk "AvrRoot-${VERSION}.apk"
          gh release delete "v${VERSION}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "v${VERSION}" "AvrRoot-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AvrRoot ${VERSION}" \
            --notes "AvrRoot beta ${VERSION}. 仅适用于联想 Y70 新一代 / moto edge 70 max (XT2611, avr)：build W3WWL36.65-48-7 或 A171WWH.42-35-16。临时 root，重启即失效。" \
            --prerelease
